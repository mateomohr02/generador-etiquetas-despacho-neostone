<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Etiquetas de Despacho — Neostone</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <main id="pantalla-busqueda" class="pantalla">
        <h1>Etiquetas de despacho</h1>
        <label for="input-pedido">Número de pedido</label>
        <input id="input-pedido" type="text" placeholder="Ej: 26-02464" autofocus />
        <button id="btn-buscar">Buscar pedido</button>
        <p id="mensaje-error" class="error"></p>
    </main>

    <section id="pantalla-preview" class="pantalla-preview oculto">
        <div class="preview-header">
            <button id="btn-volver">← Volver a la búsqueda</button>
            <h2 id="preview-titulo"></h2>
        </div>
        <p id="mensaje-error-preview" class="error"></p>
        <div id="lista-etiquetas" class="lista-etiquetas"></div>
    </section>

    <script src="renderer.js"></script>
</body>
</html>
